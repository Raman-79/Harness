[project]
name = "forge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "deepagents>=0.6,<0.7",
    "langchain-core>=0.3",
    "langchain-cloudflare>=0.3",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "langchain-text-splitters>=0.3",
    "e2b>=1.0",
    "langchain-e2b",
    "langchain-mcp-adapters>=0.3",
    "cryptography>=43.0",
    "httpx>=0.27",
    "langgraph-checkpoint",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
